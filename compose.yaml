# Local development infrastructure only. Not used by tests (they use Testcontainers).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Single-node KRaft broker (the image's defaults advertise localhost:9092)
  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"

volumes:
  postgres-data:
