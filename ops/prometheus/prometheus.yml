# Local Prometheus for OrderFlow (compose profile "observability").
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: orderflow
    metrics_path: /actuator/prometheus
    static_configs:
      # Local profile: management endpoints on the API port. In prod they are on 8081 (MANAGEMENT_PORT).
      - targets: ["host.docker.internal:8080"]
