# Alert rules for OrderFlow. Thresholds are starting points; tune them on real traffic.
# Runbook: docs/operations/runbook.md
#
# Failure counters are created on first use, so a new series can start at 1 and increase() would report 0.
# "x unless x offset 5m" also catches series that appeared within the window.
groups:
  - name: orderflow
    rules:
      - alert: OrderFlowEventsDeadLettered
        expr: |
          sum by (topic) (increase(orderflow_events_dead_lettered_total[5m])) > 0
          or sum by (topic) (orderflow_events_dead_lettered_total unless orderflow_events_dead_lettered_total offset 5m)
        labels:
          severity: page
        annotations:
          summary: "Events moved to {{ $labels.topic }}.DLT; they are no longer processed automatically"
          runbook: docs/operations/runbook.md#failed-payments

      - alert: OrderFlowOutboxStuck
        expr: |
          orderflow_outbox_pending > 0
          unless on (application) sum by (application) (increase(orderflow_outbox_publish_delay_seconds_count[5m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} outbox events pending and nothing published for 5 minutes"
          runbook: docs/operations/runbook.md#stuck-outbox-events

      - alert: OrderFlowEventDelayHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(orderflow_outbox_publish_delay_seconds_bucket[5m]))) > 30
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "p99 outbox publish delay above 30 s"
          runbook: docs/operations/runbook.md#stuck-outbox-events

      - alert: OrderFlowPaymentFailureRatioHigh
        expr: |
          sum(rate(orderflow_orders_payment_results_total{result="failed"}[15m]))
            / sum(rate(orderflow_orders_payment_results_total[15m])) > 0.2
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "More than 20 % of payment results are failures"
          runbook: docs/operations/runbook.md#failed-payments

      - alert: OrderFlowApiErrors
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[5m]))
            / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "More than 1 % of API requests fail with 5xx"
