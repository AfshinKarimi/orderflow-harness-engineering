spring:
  application:
    name: orderflow
  profiles:
    # Used only when no profile is set explicitly; production must set SPRING_PROFILES_ACTIVE=prod.
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    producer:
      # Durable, de-duplicated producer writes; fail within ~10 s when the broker is unreachable (ADR-0003).
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 5000
    consumer:
      # A new consumer group must not skip events published before it first connected.
      auto-offset-reset: earliest
    listener:
      # Commit each record's offset only after the listener returned successfully (at-least-once).
      ack-mode: record

logging:
  pattern:
    # Readable console lines carry the correlation and event IDs; prod logs JSON instead (application-prod.yml).
    correlation: "[%X{correlationId:-} %X{eventId:-}] "

orderflow:
  kafka:
    consumer:
      attempts: 3
      backoff: 1s
  outbox:
    relay:
      enabled: true
      interval: 1s
      batch-size: 100
      send-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    # Low-cardinality common tag; never add per-order or per-customer tags (docs/operations/observability.md).
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets so p95/p99 latency can be computed and aggregated across instances.
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
  endpoint:
    health:
      probes:
        enabled: true
